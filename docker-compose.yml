services:
  clamav:
    image: clamav/clamav:1.5
    environment:
      FRESHCLAM_CHECKS: "12"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncryptedDoc: "yes"
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 12m
    networks:
      - internal-services
      - outbound
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.7
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Define RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Define RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - internal-services
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: wedding-planner-web
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Antivirus__Host: clamav
      Antivirus__Port: "3310"
      Antivirus__Enabled: "true"
      Antivirus__Required: "true"
      Antivirus__TimeoutSeconds: ${ANTIVIRUS_TIMEOUT_SECONDS:-30}
      Antivirus__MaxScanSizeBytes: ${ANTIVIRUS_MAX_SCAN_SIZE_BYTES:-10485760}
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:?Define DB_HOST in .env};Port=${DB_PORT:-5432};Database=${DB_NAME:?Define DB_NAME in .env};Username=${DB_USER:?Define DB_USER in .env};Password=${DB_PASSWORD:?Define DB_PASSWORD in .env}
      FileStorage__Endpoint: http://rustfs:9000
      FileStorage__Bucket: ${RUSTFS_BUCKET:-wedding-documents}
      FileStorage__Region: ${RUSTFS_REGION:-us-east-1}
      FileStorage__AccessKey: ${RUSTFS_ACCESS_KEY:?Define RUSTFS_ACCESS_KEY in .env}
      FileStorage__SecretKey: ${RUSTFS_SECRET_KEY:?Define RUSTFS_SECRET_KEY in .env}
      FileStorage__UseSSL: "false"
      FileStorage__ForcePathStyle: "true"
      Authentication__Provider: ${AUTH_PROVIDER:-None}
      Authentication__Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Authentication__Firebase__Issuer: ${FIREBASE_ISSUER:-}
      Authentication__Firebase__Audience: ${FIREBASE_AUDIENCE:-}
      Authentication__Supabase__Url: ${SUPABASE_URL:-}
      Authentication__Supabase__Issuer: ${SUPABASE_ISSUER:-}
      Authentication__Supabase__Audience: ${SUPABASE_AUDIENCE:-authenticated}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - aspnet_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      clamav:
        condition: service_started
      rustfs:
        condition: service_healthy
    networks:
      - internal-services
      - outbound
    restart: unless-stopped

volumes:
  clamav_data:
  rustfs_data:
  aspnet_keys:

networks:
  internal-services:
    internal: true
  outbound: