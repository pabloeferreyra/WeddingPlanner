services:
  rustfs:
    image: rustfs/rustfs:1.0.7
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Define RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Define RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - wedding-planner

  web:
    environment:
      FileStorage__Endpoint: http://rustfs:9000
      FileStorage__Bucket: ${RUSTFS_BUCKET:-wedding-documents}
      FileStorage__Region: ${RUSTFS_REGION:-us-east-1}
      FileStorage__AccessKey: ${RUSTFS_ACCESS_KEY:?Define RUSTFS_ACCESS_KEY in .env}
      FileStorage__SecretKey: ${RUSTFS_SECRET_KEY:?Define RUSTFS_SECRET_KEY in .env}
      FileStorage__UseSSL: "false"
      FileStorage__ForcePathStyle: "true"
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs_data:
